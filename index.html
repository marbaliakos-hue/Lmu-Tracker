
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Sim Progress Tracker – LMU Pro</title>
  <meta name="theme-color" content="#090a10" />
  <style>
    :root {
      --bg: #000000;
      --card: #111111;
      --border: #333333;
      --red: #cc0000;
      --red-glow: rgba(204, 0, 0, 0.2);
      --green: #00cc33;
      --text: #ffffff;
      --muted: #888888;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    header {
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      text-transform: uppercase;
      background: #050505;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .container {
        padding: 16px;
        padding-bottom: 140px;
        max-width: 600px;
        margin: 0 auto;
    }

    .view { animation: viewIn 0.28s ease-out both; }
    .hidden { display: none !important; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      60% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(204,0,0,0); }
      50% { box-shadow: 0 0 22px rgba(204,0,0,0.35); }
    }

    @keyframes sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(220%); }
    }

    @keyframes flashGreen {
      0% { background: rgba(0,204,51,0.25); }
      100% { background: var(--card); }
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .menu {
      display: grid;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
      justify-items: stretch;
      text-align: center;
    }

    .menu .btn {
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: cardIn 0.4s ease-out both;
    }

    .menu .btn span { display: none; }

    .menu .btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transform: translateX(-120%);
    }

    .menu .btn:active::after { animation: sweep 0.5s ease-out; }

    .menu .btn:nth-child(1) { animation-delay: 0.02s; }
    .menu .btn:nth-child(2) { animation-delay: 0.06s; }
    .menu .btn:nth-child(3) { animation-delay: 0.10s; }
    .menu .btn:nth-child(4) { animation-delay: 0.14s; }
    .menu .btn:nth-child(5) { animation-delay: 0.18s; }
    .menu .btn:nth-child(6) { animation-delay: 0.22s; }
    .menu .btn:nth-child(7) { animation-delay: 0.26s; }

    .menu .btn:first-child {
      border-color: rgba(204,0,0,0.55);
      animation: cardIn 0.4s ease-out both, pulseGlow 3s ease-in-out infinite 0.6s;
    }

    .menu .btn:active { transform: scale(0.985); }

    .menu .divider { height: 1px; background: #222; margin: 10px 0; width: 100%; }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      transition: transform 0.12s ease-out, background 0.15s ease-out, border-color 0.15s ease-out;
    }

    .btn:active { background: #222; }

    .btn span { transition: transform 0.15s ease-out; }
    .btn:active span { transform: translateX(4px); }

    .list { display: flex; flex-direction: column; gap: 10px; }

    .item {
      padding: 16px;
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: cardIn 0.35s ease-out both;
      transition: border-color 0.15s ease-out, transform 0.12s ease-out;
    }

    .item:active { transform: scale(0.99); border-color: #444; }

    .item.fresh { animation: cardIn 0.35s ease-out both, flashGreen 1.1s ease-out; }

    .item.removing { animation: shakeX 0.25s ease-out both; opacity: 0.4; }

    .delete-btn {
      background: #330000;
      color: #ff5555;
      border: 1px solid #550000;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }

    .plus {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: var(--red);
      color: white;
      border: none;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .plus:active { transform: scale(0.9); }

    .plus { transition: transform 0.12s ease-out, box-shadow 0.2s ease-out; animation: popIn 0.4s ease-out both 0.1s; }

    .plus.bump { animation: popIn 0.35s ease-out; box-shadow: 0 0 18px var(--red-glow); }

    .back {
      color: var(--muted);
      margin-bottom: 20px;
      display: inline-block;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 0;
    }
    .back:active { color: white; }

    .picker { display:flex; gap:8px; margin-top:25px; justify-content: center; align-items: center; }
    .picker input, .picker select {
      background: #000;
      color: white;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      font-size: 18px;
      text-align: center;
    }
    .picker input:focus { border-color: var(--red); outline: none; }

    .pb { color: var(--green); font-weight: bold; }
    .slow { color: #ff5555; font-weight: bold; }

    .stat {
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .compute-btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      text-transform: uppercase;
    }
    .compute-btn:active { opacity: 0.8; transform: scale(0.985); }

    .compute-btn { transition: transform 0.12s ease-out, opacity 0.15s ease-out; }

    .stat { animation: cardIn 0.35s ease-out both; }

    .stat .bar {
      height: 6px;
      border-radius: 4px;
      background: #1c1c1c;
      overflow: hidden;
      margin-top: 12px;
    }

    .stat .bar > i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--red), #ff4444);
      transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .stat .bar.gain > i { background: linear-gradient(90deg, #00a82a, var(--green)); }

    .stat .big { font-size: 26px; font-weight: 800; display: inline-block; }

    .stat .big.pop { animation: popIn 0.45s ease-out both; }

    .saved-type { font-size: 12px; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display:block; }
    .saved-dates { font-size: 13px; color: var(--muted); margin-top: 4px; display:block; }
    .saved-main { font-size: 18px; font-weight: bold; }


    /* ── LIQUID GLASS REDESIGN ─────────────────────────────────────── */
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --card: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.13);
      --red: #ff3b48;
      --red-glow: rgba(255,59,72,.25);
      --green: #67f5a7;
      --text: #f6f7fb;
      --muted: #9ba3b3;
      --glass: rgba(255,255,255,.065);
      --glass-deep: rgba(18,21,30,.72);
    }

    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      background: #080a10;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 12% 4%, rgba(255,48,64,.18), transparent 34%),
        radial-gradient(ellipse at 93% 28%, rgba(78,101,190,.16), transparent 33%),
        radial-gradient(ellipse at 55% 100%, rgba(255,255,255,.055), transparent 42%),
        linear-gradient(145deg, #080a10 0%, #10121b 50%, #07080d 100%);
    }
    body > header { z-index: 50; }
    body > .container { position: relative; z-index: 1; }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 15px 20px 13px;
      background: rgba(13,15,23,.66);
      border-bottom: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 10px 36px rgba(0,0,0,.12), inset 0 1px rgba(255,255,255,.1);
      -webkit-backdrop-filter: blur(28px) saturate(165%);
      backdrop-filter: blur(28px) saturate(165%);
      font-size: 14px;
      letter-spacing: 2.3px;
    }
    header::after {
      content: "SIM RACING  •  DRIVER DEVELOPMENT";
      color: rgba(220,225,238,.55);
      font-size: 8px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .container { max-width: 660px; padding: 22px 17px calc(120px + env(safe-area-inset-bottom)); }
    .view { animation: viewIn .32s cubic-bezier(.2,.7,.2,1) both; }

    .dashboard-intro { padding: 18px 5px 25px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ff7d86;
      font-size: 9px;
      line-height: 1.4;
      font-weight: 800;
      letter-spacing: 2.1px;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px rgba(255,59,72,.8);
    }
    .dashboard-intro h1 {
      margin: 17px 0 10px;
      font-size: clamp(30px, 8vw, 43px);
      line-height: 1.06;
      letter-spacing: -1.7px;
      font-weight: 800;
    }
    .dashboard-intro h1 span {
      color: transparent;
      background: linear-gradient(100deg, #fff 3%, #ffc4c8 48%, #ff4958 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .dashboard-intro p { max-width: 330px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .menu { max-width: none; gap: 11px; text-align: left; }
    .menu .btn {
      min-height: 78px;
      padding: 14px 14px;
      gap: 13px;
      justify-content: flex-start;
      text-align: left;
      border-radius: 19px;
      background: linear-gradient(130deg, rgba(255,255,255,.095), rgba(255,255,255,.025) 70%);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 1px rgba(255,255,255,.12), 0 9px 24px rgba(0,0,0,.12);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      backdrop-filter: blur(22px) saturate(155%);
      animation: cardIn .42s cubic-bezier(.2,.7,.2,1) both;
    }
    .menu .btn:first-child {
      border-color: rgba(255,85,98,.4);
      background: linear-gradient(120deg, rgba(255,57,72,.16), rgba(255,255,255,.045) 72%);
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 10px 30px rgba(255,35,52,.06);
      animation: cardIn .42s cubic-bezier(.2,.7,.2,1) both, pulseGlow 3.8s ease-in-out infinite .6s;
    }
    .menu .btn span { display: block; }
    .menu-icon {
      display: grid !important;
      place-items: center;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      color: #ff7b85;
      font-size: 22px;
      line-height: 1;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
      box-shadow: inset 0 1px rgba(255,255,255,.13), 0 4px 12px rgba(0,0,0,.14);
    }
    .menu-copy { min-width: 0; display: flex !important; flex-direction: column; gap: 5px; flex: 1; }
    .menu-copy strong { font-size: 12px; font-weight: 800; letter-spacing: 1.15px; line-height: 1.2; }
    .menu-copy small { color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: 0; line-height: 1.35; }
    .btn-arrow {
      display: grid !important;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      margin-left: auto;
      color: rgba(241,244,251,.65);
      font-size: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      border-radius: 50%;
      transition: transform .2s ease, color .2s ease;
    }
    .menu .btn:hover .btn-arrow { transform: translate(2px,-2px); color: white; }
    .menu .btn:active { transform: scale(.985); }
    .menu .btn::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); }
    .menu .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      height: auto;
      margin: 12px 2px 4px;
      background: none;
      color: rgba(190,197,212,.55);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: left;
    }
    .menu .divider::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, rgba(255,255,255,.15), transparent); }
    .menu .secondary-action { min-height: 70px; }
    .menu .secondary-action .menu-icon { color: #c0c9ff; }
    .menu .danger-action { min-height: 66px; margin-top: 5px; border-color: rgba(255,81,94,.16); background: rgba(255,59,72,.035); }
    .menu .danger-action .menu-icon { color: #ff6672; border-color: rgba(255,81,94,.18); background: rgba(255,59,72,.07); }
    .menu .danger-action .menu-copy strong { color: #ff929a; }
    .menu .danger-action .menu-copy small { color: rgba(255,160,166,.6); }

    .btn, .item, .stat {
      color: var(--text);
      border-color: rgba(255,255,255,.13);
      background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.028));
      box-shadow: inset 0 1px rgba(255,255,255,.09), 0 8px 24px rgba(0,0,0,.1);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      backdrop-filter: blur(22px) saturate(155%);
    }
    .btn {
      border-radius: 16px;
      border-width: 1px;
      padding: 17px;
      min-height: 58px;
      transition: transform .16s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .btn:hover { border-color: rgba(255,255,255,.23); }
    .btn:active { background: rgba(255,255,255,.095); transform: scale(.99); }
    .list { gap: 11px; }
    .list > .btn { text-align: left; }
    .item {
      position: relative;
      overflow: hidden;
      gap: 14px;
      padding: 17px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .item::before, .stat::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
    }
    .item:active { border-color: rgba(255,255,255,.26); }
    .item.fresh { animation: cardIn .35s ease-out both, flashGreen 1.1s ease-out; }
    .delete-btn {
      flex: 0 0 auto;
      min-width: 38px;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid rgba(255,91,103,.22);
      border-radius: 12px;
      color: #ff8790;
      background: linear-gradient(145deg, rgba(255,59,72,.16), rgba(255,255,255,.035));
      box-shadow: inset 0 1px rgba(255,255,255,.09);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .plus {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: max(18px, calc((100vw - 660px) / 2 + 18px));
      width: 60px;
      height: 60px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 21px;
      background: linear-gradient(145deg, rgba(255,86,97,.98), rgba(198,15,33,.92));
      box-shadow: inset 0 1px rgba(255,255,255,.35), 0 9px 30px rgba(255,36,54,.3), 0 4px 12px rgba(0,0,0,.28);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      font-size: 31px;
    }
    .plus:active { transform: scale(.92); }
    .back {
      position: relative;
      padding: 9px 13px;
      margin: 0 0 22px;
      color: #d3d7e1;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px;
      background: rgba(255,255,255,.05);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      font-size: 11px;
      letter-spacing: 1px;
      transition: background .2s ease, color .2s ease;
    }
    .back:hover { color: white; background: rgba(255,255,255,.09); }

    input:not([type="checkbox"]), select, textarea {
      color: var(--text);
      border: 1px solid rgba(255,255,255,.15) !important;
      border-radius: 13px !important;
      background: rgba(255,255,255,.055) !important;
      box-shadow: inset 0 1px rgba(255,255,255,.055);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      backdrop-filter: blur(18px) saturate(150%);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    input:not([type="checkbox"]):focus, select:focus, textarea:focus {
      border-color: rgba(255,91,104,.72) !important;
      box-shadow: 0 0 0 3px rgba(255,59,72,.1), inset 0 1px rgba(255,255,255,.07);
    }
    input::placeholder { color: rgba(190,197,212,.52); }
    select option { background: #171923; color: #f6f7fb; }
    .picker {
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 25px;
      padding: 14px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 19px;
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px rgba(255,255,255,.07);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
      backdrop-filter: blur(22px) saturate(145%);
    }
    .picker input, .picker select { padding: 12px 8px; font-size: 17px; }
    .compute-btn {
      min-height: 56px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 16px;
      background: linear-gradient(120deg, #ff4654, #d8192c 72%, #b80d22);
      box-shadow: inset 0 1px rgba(255,255,255,.28), 0 8px 24px rgba(226,25,45,.2);
      letter-spacing: 1px;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    .compute-btn:active { opacity: .9; transform: scale(.99); }
    .stat {
      position: relative;
      overflow: hidden;
      padding: 21px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px;
      line-height: 1.75;
    }
    .stat hr { border-top-color: rgba(255,255,255,.12) !important; }
    .stat .bar { height: 7px; background: rgba(255,255,255,.08); border-radius: 99px; }
    .stat .bar > i { border-radius: 99px; box-shadow: 0 0 14px rgba(255,59,72,.23); }
    .stat .bar.gain > i { box-shadow: 0 0 14px rgba(103,245,167,.2); }
    .stat .big { letter-spacing: -.8px; }
    .pb { color: var(--green); }
    .slow { color: #ff818b; }
    .saved-type { letter-spacing: 1.5px; font-size: 9px; font-weight: 800; }
    .saved-main { font-size: 16px; line-height: 1.5; }
    .saved-dates { line-height: 1.5; }
    .clear-history {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .clear-history span { font-size: 18px; }

    :focus-visible { outline: 2px solid rgba(255,105,116,.9); outline-offset: 3px; }
    button { touch-action: manipulation; }
    @media (min-width: 600px) {
      .container { padding-top: 30px; }
      .dashboard-intro { padding-top: 24px; padding-bottom: 30px; }
      .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .menu .btn { min-height: 106px; align-items: flex-start; flex-wrap: wrap; }
      .menu .menu-icon { width: 38px; height: 38px; flex-basis: 38px; }
      .menu .menu-copy { flex-basis: calc(100% - 58px); }
      .menu .btn-arrow { position: absolute; right: 13px; top: 13px; width: 24px; height: 24px; }
      .menu .divider { grid-column: 1 / -1; }
      .menu .danger-action { margin-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

  </style>
</head>
<body>

<header id="headerTitle">LMU TRACKER</header>

<div class="container">
    <div id="menu" class="view hidden">
        <section class="dashboard-intro" aria-label="Dashboard introduction">
            <div class="eyebrow"><span class="status-dot"></span> DRIVER DEVELOPMENT / LMU</div>
            <h1>Find your next<br><span> tenth of a second.</span></h1>
            <p>Your pace, consistency and race progress — all in one cockpit.</p>
        </section>
        <div class="menu">
            <button class="btn" onclick="navigateTo('tracks')">
                <span class="menu-icon" aria-hidden="true">◷</span>
                <span class="menu-copy"><strong>LAP RECORDS</strong><small>Save and compare your fastest laps</small></span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="btn" onclick="navigateTo('consistency')">
                <span class="menu-icon" aria-hidden="true">◎</span>
                <span class="menu-copy"><strong>CONSISTENCY</strong><small>Review your race finishes</small></span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="btn" onclick="navigateTo('trackProgress')">
                <span class="menu-icon" aria-hidden="true">↗</span>
                <span class="menu-copy"><strong>TRACK PROGRESS</strong><small>Measure pace changes by circuit</small></span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="btn" onclick="navigateTo('globalProgress')">
                <span class="menu-icon" aria-hidden="true">⌁</span>
                <span class="menu-copy"><strong>OVERALL PROGRESS</strong><small>See your bigger racing picture</small></span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </button>
            <div class="divider"><span>YOUR DATA</span></div>
            <button class="btn secondary-action" onclick="navigateTo('savedProgression')">
                <span class="menu-icon" aria-hidden="true">▤</span>
                <span class="menu-copy"><strong>SAVED PROGRESSION</strong><small>Revisit previous comparisons</small></span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="btn danger-action" onclick="resetAllData()">
                <span class="menu-icon" aria-hidden="true">↺</span>
                <span class="menu-copy"><strong>RESET ALL DATA</strong><small>Clear saved laps and race history</small></span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </button>
        </div>
    </div>

    <div id="tracks" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div id="trackList" class="list"></div>
    </div>

    <div id="records" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <h2 id="currentTrackTitle" style="margin:0 0 15px 0; font-size: 22px; color:#fff;"></h2>
        <div id="recordsList" class="list"></div>

        <div class="picker">
            <input type="number" id="minutes" placeholder="m" style="width:60px" inputmode="numeric">
            <span style="font-size:20px;">:</span>
            <input type="number" id="seconds" placeholder="s" style="width:60px" inputmode="numeric">
            <span style="font-size:20px;">.</span>
            <input type="number" id="milliseconds" placeholder="ms" style="width:70px" inputmode="numeric">
        </div>
        <button class="plus" onclick="addLap()">+</button>
    </div>

    <div id="consistency" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <button class="btn" onclick="navigateTo('raceFinish')">RACE FINISHES <span>›</span></button>
    </div>

    <div id="raceFinish" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div id="finishList" class="list"></div>
        <div class="picker">
            <input type="number" id="position" placeholder="Finish Position (P)" style="width:100%" inputmode="numeric">
        </div>
        <button class="plus" onclick="addFinish()">+</button>
    </div>

    <div id="trackProgress" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div style="margin-bottom:20px;">
            <label style="color:#aaa; font-size:14px; margin-bottom:5px; display:block;">Select Track:</label>
            <select id="progressTrack" style="width:100%;"></select>
        </div>
        <div style="margin-bottom:20px;">
             <label style="color:#aaa; font-size:14px; margin-bottom:5px; display:block;">Time Period (Days):</label>
            <input type="number" id="trackDays" value="30" style="width:100%;" inputmode="numeric">
        </div>
        <button class="compute-btn" onclick="computeTrackProgress()">SEE PROGRESS</button>
        <div id="trackProgressResult" style="margin-top:20px;"></div>
    </div>

    <div id="globalProgress" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div style="margin-bottom:20px;">
            <label style="color:#aaa; font-size:14px; margin-bottom:5px; display:block;">Time Period (Days):</label>
            <input type="number" id="globalDays" value="30" style="width:100%;" inputmode="numeric">
        </div>
        <button class="compute-btn" onclick="computeGlobalProgress()">SEE PROGRESS</button>
        <div id="globalProgressResult" style="margin-top:20px;"></div>
    </div>

    <div id="savedProgression" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div style="margin-bottom:15px; color:#aaa; font-size:14px;">History of all comparisons calculated:</div>
        <div id="savedList" class="list"></div>
        <button class="btn clear-history" onclick="clearSaved()">Clear saved history <span aria-hidden="true">↺</span></button>
    </div>
</div>

<script>
    const LMU_TRACKS = ["Bahrain", "Fuji", "Imola", "Interlagos", "COTA", "Le Mans", "Monza", "Portimão", "Qatar", "Sebring", "Silverstone", "Spa-Francorchamps", "Barcelona-Catalunya", "Paul Ricard", "Daytona", "Laguna Seca", "Road Atlanta", "Long Beach"];
    const MAX_SAVED = 100;

    let currentTrack = null;
    let navigationStack = ['menu'];

    let db = JSON.parse(localStorage.getItem('simTrackerLMU')) || { laps: {}, finishes: [], saved: [] };
    if (!db.saved) { db.saved = []; }

    function save() { localStorage.setItem('simTrackerLMU', JSON.stringify(db)); }

    // --- NAVIGATION LOGIC ---
    function navigateTo(viewId, trackName = null) {
        if (trackName) currentTrack = trackName;
        navigationStack.push(viewId);
        renderView(viewId);
    }

    function goBack() {
        if (navigationStack.length > 1) {
            navigationStack.pop();
            const prevView = navigationStack[navigationStack.length - 1];
            renderView(prevView);
        }
    }

    function renderView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        const activeView = document.getElementById(viewId);
        activeView.classList.remove('hidden');
        activeView.style.animation = 'none';
        void activeView.offsetWidth;
        activeView.style.animation = '';

        if (viewId === 'tracks') renderTrackList();
        if (viewId === 'records') renderRecords();
        if (viewId === 'raceFinish') renderFinishes();
        if (viewId === 'trackProgress') populateTrackSelect();
        if (viewId === 'savedProgression') renderSavedProgression();

        const titles = {
            'menu': 'LMU TRACKER', 'tracks': 'SELECT TRACK', 'consistency': 'CONSISTENCY',
            'trackProgress': 'TRACK PROGRESS', 'globalProgress': 'OVERALL', 'savedProgression': 'SAVED HISTORY',
            'raceFinish': 'RACE FINISHES', 'records': 'LAP RECORDS'
        };
        document.getElementById('headerTitle').innerText = titles[viewId] || currentTrack || 'LMU TRACKER';
        window.scrollTo(0,0);
    }

    // --- HELPERS ---
    function formatTime(ms) {
        if (!ms) return "--:--.---";
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const mm = ms % 1000;
        return `${m}:${s.toString().padStart(2, '0')}.${mm.toString().padStart(3, '0')}`;
    }

    function formatDateRange(days) {
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - days);
        return `${start.toLocaleDateString()} to ${end.toLocaleDateString()}`;
    }

    function signedDelta(delta) {
        const sign = delta > 0 ? '+' : '-';
        return `${sign}${formatTime(Math.abs(delta))}`;
    }

    // --- TRACKS & LAPS ---
    function renderTrackList() {
        const list = document.getElementById('trackList');
        list.innerHTML = '';
        LMU_TRACKS.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${t} <span>›</span>`;
            btn.onclick = () => navigateTo('records', t);
            list.appendChild(btn);
        });
    }

    function renderRecords() {
        const list = document.getElementById('recordsList');
        const laps = db.laps[currentTrack] || [];
        document.getElementById('currentTrackTitle').innerText = currentTrack;
        list.innerHTML = laps.length ? '' : '<p style="text-align:center; color:var(--muted); margin-top:20px;">No laps recorded yet.</p>';

        const bestTime = laps.length ? Math.min(...laps.map(l => l.time)) : null;

        const sorted = laps
            .map((l, i) => ({ ...l, _i: i }))
            .sort((a, b) => a.time - b.time);

        sorted.forEach(l => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <div>
                    <span class="${l.time === bestTime ? 'pb' : ''}" style="font-size:18px; font-family:monospace;">${formatTime(l.time)}</span><br>
                    <small style="color:var(--muted)">${new Date(l.date).toLocaleDateString()}</small>
                </div>
                <button class="delete-btn" onclick="deleteLap(${l._i})">✕</button>
            `;
            list.appendChild(div);
        });
    }

    function addLap() {
        const m = parseInt(document.getElementById('minutes').value) || 0;
        const s = parseInt(document.getElementById('seconds').value) || 0;
        const ms = parseInt(document.getElementById('milliseconds').value) || 0;
        const total = (m * 60000) + (s * 1000) + ms;

        if (total === 0) return;

        if (!db.laps[currentTrack]) db.laps[currentTrack] = [];
        db.laps[currentTrack].push({ time: total, date: Date.now() });
        save();

        document.getElementById('minutes').value = '';
        document.getElementById('seconds').value = '';
        document.getElementById('milliseconds').value = '';
        renderRecords();

        const plus = document.querySelector('.plus');
        if (plus) {
            plus.classList.remove('bump');
            void plus.offsetWidth;
            plus.classList.add('bump');
        }
        markFresh();
    }

    function markFresh() {
        const first = document.querySelector('.list .item');
        if (!first) return;
        first.classList.add('fresh');
        setTimeout(() => first.classList.remove('fresh'), 1200);
    }

    function deleteLap(idx) {
        if (confirm('Delete this lap?')) {
            db.laps[currentTrack].splice(idx, 1);
            save();
            renderRecords();
        }
    }

    // --- FINISHES ---
    function renderFinishes() {
        const list = document.getElementById('finishList');
        list.innerHTML = db.finishes.length ? '' : '<p style="text-align:center; color:var(--muted); margin-top:20px;">No races recorded.</p>';

        const sorted = db.finishes
            .map((f, i) => ({ ...f, _i: i }))
            .sort((a, b) => b.date - a.date);

        sorted.forEach(f => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<div><strong style="font-size:18px;">P${f.pos}</strong> <small style="color:var(--muted); margin-left:8px;">${new Date(f.date).toLocaleDateString()}</small></div>
                             <button class="delete-btn" onclick="deleteFinish(${f._i})">✕</button>`;
            list.appendChild(div);
        });
    }

    function addFinish() {
        const pos = parseInt(document.getElementById('position').value);
        if (!pos || pos < 1) return;
        db.finishes.push({ pos, date: Date.now() });
        save();
        document.getElementById('position').value = '';
        renderFinishes();
    }

    function deleteFinish(idx) {
        if (confirm('Delete this result?')) {
            db.finishes.splice(idx, 1);
            save();
            renderFinishes();
        }
    }

    // --- PROGRESS LOGIC ---
    function populateTrackSelect() {
        const sel = document.getElementById('progressTrack');
        sel.innerHTML = LMU_TRACKS.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function computeTrackProgress() {
        const track = document.getElementById('progressTrack').value;
        const days = parseInt(document.getElementById('trackDays').value) || 30;
        const now = Date.now();
        const laps = (db.laps[track] || [])
            .filter(l => l.date > (now - days * 86400000))
            .sort((a, b) => a.date - b.date);

        const res = document.getElementById('trackProgressResult');

        if (laps.length < 2) {
            res.innerHTML = '<div class="stat" style="text-align:center; color:var(--red);">Need at least 2 laps in this period to calculate.</div>';
            return;
        }

        const prev = laps[laps.length - 2];
        const last = laps[laps.length - 1];
        const delta = last.time - prev.time;
        const isGain = delta < 0;
        const pct = ((Math.abs(delta) / prev.time) * 100).toFixed(2);

        const best = Math.min(...laps.map(l => l.time));
        const dateRangeStr = formatDateRange(days);

        db.saved.unshift({
            type: 'track',
            track: track,
            dates: dateRangeStr,
            imp: pct,
            gain: isGain,
            delta: delta,
            prevTime: prev.time,
            lastTime: last.time,
            timestamp: Date.now()
        });
        db.saved = db.saved.slice(0, MAX_SAVED);
        save();

        res.innerHTML = `<div class="stat">
            <strong style="font-size:18px;">${track}</strong><br>
            <span style="color:var(--muted)">${dateRangeStr}</span>
            <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">
            Previous lap: <span style="font-family:monospace;">${formatTime(prev.time)}</span><br>
            Latest lap: <span style="font-family:monospace;">${formatTime(last.time)}</span><br>
            <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">
            <span class="${isGain ? 'pb' : 'slow'} big pop">${isGain ? '−' : '+'}${pct}%</span>
            <span style="color:var(--muted); font-size:14px;">(${signedDelta(delta)})</span><br>
            <span style="color:var(--muted); font-size:14px;">Session best: ${formatTime(best)}</span>
            <div class="bar ${isGain ? 'gain' : ''}"><i data-w="${Math.min(100, Math.abs(parseFloat(pct)) * 12).toFixed(1)}"></i></div>
        </div>
        <div style="text-align:center; color:var(--green); font-size:12px; margin-top:5px;">Saved to Progression History ✓</div>`;
    }

    function computeGlobalProgress() {
        const days = parseInt(document.getElementById('globalDays').value) || 30;
        const now = Date.now();
        const fins = db.finishes.filter(f => f.date > (now - days * 86400000));
        const res = document.getElementById('globalProgressResult');

        if (!fins.length) {
            res.innerHTML = '<div class="stat" style="text-align:center;">No races in this period.</div>';
            return;
        }

        const avg = (fins.reduce((a, b) => a + b.pos, 0) / fins.length).toFixed(1);
        const dateRangeStr = formatDateRange(days);

        db.saved.unshift({
            type: 'global',
            dates: dateRangeStr,
            avg: avg,
            timestamp: Date.now()
        });
        db.saved = db.saved.slice(0, MAX_SAVED);
        save();

        res.innerHTML = `<div class="stat">
             <strong style="font-size:18px;">Overall Performance</strong><br>
             <span style="color:var(--muted)">${dateRangeStr}</span>
             <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">
             Avg Finish: <strong style="color:var(--text); font-size:24px;">P${avg}</strong><br>
             Races: ${fins.length}
             <div class="bar gain"><i data-w="${Math.max(4, Math.min(100, (1 - (parseFloat(avg) - 1) / 20) * 100)).toFixed(1)}"></i></div>
        </div>
        <div style="text-align:center; color:var(--green); font-size:12px; margin-top:5px;">Saved to Progression History ✓</div>`;
    }

    // --- SAVED PROGRESSION VIEW ---
    function renderSavedProgression() {
        const list = document.getElementById('savedList');
        list.innerHTML = db.saved.length ? '' : '<p style="text-align:center; color:var(--muted); margin-top:20px;">No comparisons saved yet.<br>Go to Progress menus and compute stats!</p>';

        db.saved.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'item';

            let content = '';

            if (item.type === 'track') {
                const gain = item.gain !== undefined ? item.gain : true;
                content = `
                    <div>
                        <span class="saved-type" style="color:var(--red);">TRACK PROGRESS</span>
                        <span class="saved-main">${item.track}: <span class="${gain ? 'pb' : 'slow'}">${gain ? '−' : '+'}${item.imp}%</span></span>
                        <span class="saved-dates">${item.dates}</span>
                    </div>
                `;
            } else {
                content = `
                    <div>
                        <span class="saved-type" style="color:var(--green);">OVERALL PROGRESS</span>
                        <span class="saved-main">Avg Finish: P${item.avg}</span>
                        <span class="saved-dates">${item.dates}</span>
                    </div>
                `;
            }

            div.innerHTML = content + `<button class="delete-btn" onclick="deleteSaved(${idx})">✕</button>`;
            list.appendChild(div);
        });
    }

    function deleteSaved(idx) {
        if (confirm('Delete this saved progression?')) {
            db.saved.splice(idx, 1);
            save();
            renderSavedProgression();
        }
    }

    function clearSaved() {
        if (confirm('Clear all saved history?')) {
            db.saved = [];
            save();
            renderSavedProgression();
        }
    }

    function resetAllData() {
        if (confirm('This will delete ALL your lap times, race finishes, and saved progressions. Are you sure?')) {
            db = { laps: {}, finishes: [], saved: [] };
            save();
            alert('All data has been reset.');
            renderView('menu');
        }
    }

    function animateBars() {
        requestAnimationFrame(() => {
            document.querySelectorAll('.stat .bar > i').forEach(el => {
                el.style.width = (el.dataset.w || 0) + '%';
            });
        });
    }

    const _renderView = renderView;
    renderView = function (viewId) {
        _renderView(viewId);
        animateBars();
    };

    renderView('menu');
</script>
</body>
</html>
