<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Sim Progress Tracker – LMU Pro</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #000000;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-strong: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-edge: rgba(255, 255, 255, 0.30);
      --red: #cc0000;
      --red-glow: rgba(204, 0, 0, 0.35);
      --green: #00cc33;
      --text: #ffffff;
      --muted: #9a9a9a;
      --blur: 22px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { background: #000; }

    body {
      margin: 0;
      background: #000;
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* --- AMBIENT LIGHT (δίνει κάτι να θολώσει το glass) --- */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
    }
    .blob-1 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, #cc0000 0%, rgba(204,0,0,0) 70%);
      top: -90px; left: -80px;
    }
    .blob-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #ff2d55 0%, rgba(255,45,85,0) 70%);
      top: 38%; right: -110px;
      opacity: 0.35;
    }
    .blob-3 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #7a0000 0%, rgba(122,0,0,0) 70%);
      bottom: -120px; left: 10%;
      opacity: 0.4;
    }

    /* --- GLASS BASE --- */
    .glass {
      background: var(--glass);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* specular highlight — η γυαλιστερή γραμμή φωτός */
    .glass::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-edge), transparent);
      pointer-events: none;
    }

    /* fallback για browsers χωρίς backdrop-filter */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: rgba(20, 20, 20, 0.92); }
    }

    header {
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 50;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
      background: rgba(10, 10, 10, 0.55);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .container {
      padding: 16px;
      padding-bottom: 140px;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .view { transition: opacity 0.2s ease-out; opacity: 1; }
    .hidden { display: none !important; opacity: 0; }

    .menu { display: grid; gap: 12px; }

    .btn {
      background: var(--glass);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-edge), transparent);
      pointer-events: none;
    }
    .btn:active {
      background: var(--glass-strong);
      transform: scale(0.985);
    }

    .list { display: flex; flex-direction: column; gap: 10px; }

    .item {
      padding: 16px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .item::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-edge), transparent);
      pointer-events: none;
    }

    .delete-btn {
      background: rgba(255, 60, 60, 0.12);
      color: #ff5555;
      border: 1px solid rgba(255, 85, 85, 0.35);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .delete-btn:active { background: rgba(255, 60, 60, 0.25); }

    .plus {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(204, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      color: white;
      border: 1px solid rgba(255, 90, 90, 0.5);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 30px;
      box-shadow: 0 8px 28px var(--red-glow), inset 0 1px 0 rgba(255,255,255,0.25);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .plus:active { transform: scale(0.9); }

    .back {
      color: var(--muted);
      margin-bottom: 20px;
      display: inline-block;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 0;
    }
    .back:active { color: white; }

    .picker {
      display: flex;
      gap: 8px;
      margin-top: 25px;
      justify-content: center;
      align-items: center;
    }
    .picker input, .picker select {
      background: rgba(255,255,255,0.06);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      backdrop-filter: blur(14px) saturate(160%);
      color: white;
      border: 1px solid var(--glass-border);
      padding: 12px;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
    }
    .picker input:focus, .picker select:focus {
      border-color: rgba(255, 80, 80, 0.7);
      outline: none;
      box-shadow: 0 0 0 3px rgba(204,0,0,0.18);
    }

    select, input[type="number"] {
      background: rgba(255,255,255,0.06);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      backdrop-filter: blur(14px) saturate(160%);
      color: white;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
    }
    select option { background: #111; color: #fff; }

    .pb { color: var(--green); font-weight: bold; }
    .slow { color: #ff5555; font-weight: bold; }

    .stat {
      padding: 20px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      margin-bottom: 15px;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .stat::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-edge), transparent);
      pointer-events: none;
    }

    .compute-btn {
      background: rgba(204, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      color: white;
      border: 1px solid rgba(255, 90, 90, 0.45);
      padding: 16px;
      border-radius: 16px;
      width: 100%;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      text-transform: uppercase;
      box-shadow: 0 8px 24px var(--red-glow), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.12s ease;
    }
    .compute-btn:active { opacity: 0.85; transform: scale(0.985); }

    .saved-type { font-size: 12px; color: #ff5555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
    .saved-dates { font-size: 13px; color: var(--muted); margin-top: 4px; display: block; }
    .saved-main { font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<header id="headerTitle">LMU TRACKER</header>

<div class="container">
    <div id="menu" class="view">
        <button class="btn" onclick="navigateTo('tracks')">LAP RECORDS <span>›</span></button>
        <button class="btn" onclick="navigateTo('consistency')">CONSISTENCY <span>›</span></button>
        <button class="btn" onclick="navigateTo('trackProgress')">TRACK PROGRESS <span>›</span></button>
        <button class="btn" onclick="navigateTo('globalProgress')">OVERALL PROGRESS <span>›</span></button>
        <div style="height:1px; background:rgba(255,255,255,0.10); margin:10px 0;"></div>
        <button class="btn" onclick="navigateTo('savedProgression')">SAVED PROGRESSION <span>›</span></button>
        <button class="btn" onclick="resetAllData()" style="color:#ff5555; border-color:rgba(255,85,85,0.3); margin-top:20px;">RESET ALL DATA</button>
    </div>

    <div id="tracks" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div id="trackList" class="list"></div>
    </div>

    <div id="records" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <h2 id="currentTrackTitle" style="margin:0 0 15px 0; font-size: 22px; color:#fff;"></h2>
        <div id="recordsList" class="list"></div>

        <div class="picker">
            <input type="number" id="minutes" placeholder="m" style="width:60px" inputmode="numeric">
            <span style="font-size:20px;">:</span>
            <input type="number" id="seconds" placeholder="s" style="width:60px" inputmode="numeric">
            <span style="font-size:20px;">.</span>
            <input type="number" id="milliseconds" placeholder="ms" style="width:70px" inputmode="numeric">
        </div>
        <button class="plus" onclick="addLap()">+</button>
    </div>

    <div id="consistency" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <button class="btn" onclick="navigateTo('raceFinish')">RACE FINISHES <span>›</span></button>
    </div>

    <div id="raceFinish" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div id="finishList" class="list"></div>
        <div class="picker">
            <input type="number" id="position" placeholder="Finish Position (P)" style="width:100%" inputmode="numeric">
        </div>
        <button class="plus" onclick="addFinish()">+</button>
    </div>

    <div id="trackProgress" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div style="margin-bottom:20px;">
            <label style="color:#aaa; font-size:14px; margin-bottom:5px; display:block;">Select Track:</label>
            <select id="progressTrack" style="width:100%;"></select>
        </div>
        <div style="margin-bottom:20px;">
             <label style="color:#aaa; font-size:14px; margin-bottom:5px; display:block;">Time Period (Days):</label>
            <input type="number" id="trackDays" value="30" style="width:100%;" inputmode="numeric">
        </div>
        <button class="compute-btn" onclick="computeTrackProgress()">SEE PROGRESS</button>
        <div id="trackProgressResult" style="margin-top:20px;"></div>
    </div>

    <div id="globalProgress" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div style="margin-bottom:20px;">
            <label style="color:#aaa; font-size:14px; margin-bottom:5px; display:block;">Time Period (Days):</label>
            <input type="number" id="globalDays" value="30" style="width:100%;" inputmode="numeric">
        </div>
        <button class="compute-btn" onclick="computeGlobalProgress()">SEE PROGRESS</button>
        <div id="globalProgressResult" style="margin-top:20px;"></div>
    </div>

    <div id="savedProgression" class="view hidden">
        <a class="back" onclick="goBack()">← Back</a>
        <div style="margin-bottom:15px; color:#aaa; font-size:14px;">History of all comparisons calculated:</div>
        <div id="savedList" class="list"></div>
        <button onclick="clearSaved()" style="width:100%; padding:15px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:#888; margin-top:20px; border-radius:16px;">Clear History</button>
    </div>
</div>

<script>
    const LMU_TRACKS = ["Bahrain", "Fuji", "Imola", "Interlagos", "COTA", "Le Mans", "Monza", "Portimão", "Qatar", "Sebring", "Silverstone", "Spa-Francorchamps", "Barcelona-Catalunya", "Paul Ricard", "Daytona", "Laguna Seca", "Road Atlanta", "Long Beach"];
    const MAX_SAVED = 100;

    let currentTrack = null;
    let navigationStack = ['menu'];

    let db = JSON.parse(localStorage.getItem('simTrackerLMU')) || { laps: {}, finishes: [], saved: [] };
    if (!db.saved) { db.saved = []; }

    function save() { localStorage.setItem('simTrackerLMU', JSON.stringify(db)); }

    // --- NAVIGATION LOGIC ---
    function navigateTo(viewId, trackName = null) {
        if (trackName) currentTrack = trackName;
        navigationStack.push(viewId);
        renderView(viewId);
    }

    function goBack() {
        if (navigationStack.length > 1) {
            navigationStack.pop();
            const prevView = navigationStack[navigationStack.length - 1];
            renderView(prevView);
        }
    }

    function renderView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        const activeView = document.getElementById(viewId);
        activeView.classList.remove('hidden');

        if (viewId === 'tracks') renderTrackList();
        if (viewId === 'records') renderRecords();
        if (viewId === 'raceFinish') renderFinishes();
        if (viewId === 'trackProgress') populateTrackSelect();
        if (viewId === 'savedProgression') renderSavedProgression();

        const titles = {
            'menu': 'LMU TRACKER', 'tracks': 'SELECT TRACK', 'consistency': 'CONSISTENCY',
            'trackProgress': 'TRACK PROGRESS', 'globalProgress': 'OVERALL', 'savedProgression': 'SAVED HISTORY',
            'raceFinish': 'RACE FINISHES', 'records': 'LAP RECORDS'
        };
        document.getElementById('headerTitle').innerText = titles[viewId] || currentTrack || 'LMU TRACKER';
        window.scrollTo(0,0);
    }

    // --- HELPERS ---
    function formatTime(ms) {
        if (!ms) return "--:--.---";
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const mm = ms % 1000;
        return `${m}:${s.toString().padStart(2, '0')}.${mm.toString().padStart(3, '0')}`;
    }

    function formatDateRange(days) {
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - days);
        return `${start.toLocaleDateString()} to ${end.toLocaleDateString()}`;
    }

    function signedDelta(delta) {
        const sign = delta > 0 ? '+' : '-';
        return `${sign}${formatTime(Math.abs(delta))}`;
    }

    // --- TRACKS & LAPS ---
    function renderTrackList() {
        const list = document.getElementById('trackList');
        list.innerHTML = '';
        LMU_TRACKS.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${t} <span>›</span>`;
            btn.onclick = () => navigateTo('records', t);
            list.appendChild(btn);
        });
    }

    function renderRecords() {
        const list = document.getElementById('recordsList');
        const laps = db.laps[currentTrack] || [];
        document.getElementById('currentTrackTitle').innerText = currentTrack;
        list.innerHTML = laps.length ? '' : '<p style="text-align:center; color:var(--muted); margin-top:20px;">No laps recorded yet.</p>';

        const bestTime = laps.length ? Math.min(...laps.map(l => l.time)) : null;

        // sort αντίγραφο, ώστε το index του ✕ να δείχνει στο σωστό lap
        const sorted = [...laps].sort((a, b) => a.time - b.time);
        sorted.forEach((l) => {
            const idx = laps.indexOf(l);
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <div>
                    <span class="${l.time === bestTime ? 'pb' : ''}" style="font-size:18px; font-family:monospace;">${formatTime(l.time)}</span><br>
                    <small style="color:var(--muted)">${new Date(l.date).toLocaleDateString()}</small>
                </div>
                <button class="delete-btn" onclick="deleteLap(${idx})">✕</button>
            `;
            list.appendChild(div);
        });
    }

    function addLap() {
        const m = parseInt(document.getElementById('minutes').value) || 0;
        const s = parseInt(document.getElementById('seconds').value) || 0;
        const ms = parseInt(document.getElementById('milliseconds').value) || 0;
        const total = (m * 60000) + (s * 1000) + ms;

        if (total === 0) return;

        if (!db.laps[currentTrack]) db.laps[currentTrack] = [];
        db.laps[currentTrack].push({ time: total, date: Date.now() });
        save();

        document.getElementById('minutes').value = '';
        document.getElementById('seconds').value = '';
        document.getElementById('milliseconds').value = '';
        renderRecords();
    }

    function deleteLap(idx) {
        if (confirm('Delete this lap?')) {
            db.laps[currentTrack].splice(idx, 1);
            save();
            renderRecords();
        }
    }

    // --- FINISHES ---
    function renderFinishes() {
        const list = document.getElementById('finishList');
        list.innerHTML = db.finishes.length ? '' : '<p style="text-align:center; color:var(--muted); margin-top:20px;">No races recorded.</p>';
        const sorted = [...db.finishes].sort((a, b) => b.date - a.date);
        sorted.forEach((f) => {
            const idx = db.finishes.indexOf(f);
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<div><strong style="font-size:18px;">P${f.pos}</strong> <small style="color:var(--muted); margin-left:8px;">${new Date(f.date).toLocaleDateString()}</small></div>
                             <button class="delete-btn" onclick="deleteFinish(${idx})">✕</button>`;
            list.appendChild(div);
        });
    }

    function addFinish() {
        const pos = parseInt(document.getElementById('position').value);
        if (!pos || pos < 1) return;
        db.finishes.push({ pos, date: Date.now() });
        save();
        document.getElementById('position').value = '';
        renderFinishes();
    }

    function deleteFinish(idx) {
        if (confirm('Delete this result?')) {
            db.finishes.splice(idx, 1);
            save();
            renderFinishes();
        }
    }

    // --- PROGRESS LOGIC ---
    function populateTrackSelect() {
        const sel = document.getElementById('progressTrack');
        sel.innerHTML = LMU_TRACKS.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function computeTrackProgress() {
        const track = document.getElementById('progressTrack').value;
        const days = parseInt(document.getElementById('trackDays').value) || 30;
        const now = Date.now();
        const laps = (db.laps[track] || [])
            .filter(l => l.date > (now - days * 86400000))
            .sort((a, b) => a.date - b.date);

        const res = document.getElementById('trackProgressResult');

        if (laps.length < 2) {
            res.innerHTML = '<div class="stat" style="text-align:center; color:#ff5555;">Need at least 2 laps in this period to calculate.</div>';
            return;
        }

        const prev = laps[laps.length - 2];
        const last = laps[laps.length - 1];
        const delta = last.time - prev.time;
        const imp = ((prev.time - last.time) / prev.time * 100).toFixed(2);
        const dateRangeStr = formatDateRange(days);
        const improved = delta <= 0;

        db.saved.unshift({
            type: 'track',
            track: track,
            dates: dateRangeStr,
            imp: imp,
            delta: delta,
            timestamp: Date.now()
        });
        if (db.saved.length > MAX_SAVED) db.saved.length = MAX_SAVED;
        save();

        res.innerHTML = `<div class="stat">
            <strong style="font-size:18px;">${track}</strong><br>
            <span style="color:var(--muted)">${dateRangeStr}</span>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.12); margin:10px 0;">
            Improvement: <span class="${improved ? 'pb' : 'slow'}" style="font-size:24px;">${imp}%</span><br>
            Previous: <span style="font-family:monospace;">${formatTime(prev.time)}</span><br>
            Latest: <span style="font-family:monospace;">${formatTime(last.time)}</span><br>
            Delta: <span class="${improved ? 'pb' : 'slow'}" style="font-family:monospace;">${signedDelta(delta)}</span>
        </div>
        <div style="text-align:center; color:var(--green); font-size:12px; margin-top:5px;">Saved to Progression History ✓</div>`;
    }

    function computeGlobalProgress() {
        const days = parseInt(document.getElementById('globalDays').value) || 30;
        const now = Date.now();
        const fins = db.finishes.filter(f => f.date > (now - days * 86400000));
        const res = document.getElementById('globalProgressResult');

        if (!fins.length) {
            res.innerHTML = '<div class="stat" style="text-align:center;">No races in this period.</div>';
            return;
        }

        const avg = (fins.reduce((a, b) => a + b.pos, 0) / fins.length).toFixed(1);
        const best = Math.min(...fins.map(f => f.pos));
        const dateRangeStr = formatDateRange(days);

        db.saved.unshift({
            type: 'global',
            dates: dateRangeStr,
            avg: avg,
            timestamp: Date.now()
        });
        if (db.saved.length > MAX_SAVED) db.saved.length = MAX_SAVED;
        save();

        res.innerHTML = `<div class="stat">
             <strong style="font-size:18px;">Overall Performance</strong><br>
             <span style="color:var(--muted)">${dateRangeStr}</span>
             <hr style="border:0; border-top:1px solid rgba(255,255,255,0.12); margin:10px 0;">
             Avg Finish: <strong style="color:var(--text); font-size:24px;">P${avg}</strong><br>
             Best Finish: <span class="pb">P${best}</span><br>
             Races: ${fins.length}
        </div>
        <div style="text-align:center; color:var(--green); font-size:12px; margin-top:5px;">Saved to Progression History ✓</div>`;
    }

    // --- SAVED PROGRESSION VIEW ---
    function renderSavedProgression() {
        const list = document.getElementById('savedList');
        list.innerHTML = db.saved.length ? '' : '<p style="text-align:center; color:var(--muted); margin-top:20px;">No comparisons saved yet.<br>Go to Progress menus and compute stats!</p>';

        db.saved.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'item';

            let content = '';

            if (item.type === 'track') {
                const improved = (item.delta === undefined) || item.delta <= 0;
                content = `
                    <div>
                        <span class="saved-type">TRACK PROGRESS</span>
                        <span class="saved-main">${item.track}: <span class="${improved ? 'pb' : 'slow'}">${item.imp}%</span></span>
                        <span class="saved-dates">${item.dates}</span>
                    </div>
                `;
            } else {
                content = `
                    <div>
                        <span class="saved-type" style="color:var(--green);">OVERALL PROGRESS</span>
                        <span class="saved-main">Avg Finish: P${item.avg}</span>
                        <span class="saved-dates">${item.dates}</span>
                    </div>
                `;
            }

            div.innerHTML = content + `<button class="delete-btn" onclick="deleteSaved(${idx})">✕</button>`;
            list.appendChild(div);
        });
    }

    function deleteSaved(idx) {
        if (confirm('Delete this saved progression?')) {
            db.saved.splice(idx, 1);
            save();
            renderSavedProgression();
        }
    }

    function clearSaved() {
        if (confirm('Clear all saved history?')) {
            db.saved = [];
            save();
            renderSavedProgression();
        }
    }

    function resetAllData() {
        if (confirm('This will delete ALL your lap times, race finishes, and saved progressions. Are you sure?')) {
            db = { laps: {}, finishes: [], saved: [] };
            save();
            alert('All data has been reset.');
            renderView('menu');
        }
    }

    // Initialize the app
    renderView('menu');
</script>
</body>
</html>
