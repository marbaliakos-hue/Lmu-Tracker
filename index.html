<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Sim Progress Tracker – LMU Pro</title>
<meta name="theme-color" content="#090a10" />
<style>
:root{color-scheme:dark;--bg:#080a10;--card:rgba(255,255,255,.055);--border:rgba(255,255,255,.13);--red:#ff3b48;--red-glow:rgba(255,59,72,.25);--green:#67f5a7;--text:#f6f7fb;--muted:#9ba3b3;--tab:64px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;position:relative;isolation:isolate;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 12% 4%,rgba(255,48,64,.18),transparent 34%),radial-gradient(ellipse at 93% 28%,rgba(78,101,190,.16),transparent 33%),radial-gradient(ellipse at 55% 100%,rgba(255,255,255,.055),transparent 42%),linear-gradient(145deg,#080a10,#10121b 50%,#07080d)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.dim{color:var(--muted)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}60%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(255,59,72,0)}50%{box-shadow:0 0 22px rgba(255,59,72,.35)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes flashGreen{0%{background:rgba(103,245,167,.25)}100%{background:var(--card)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pbBurst{0%{box-shadow:0 0 0 rgba(103,245,167,0)}30%{box-shadow:0 0 34px rgba(103,245,167,.45);transform:scale(1.02)}100%{box-shadow:0 0 0 rgba(103,245,167,0);transform:none}}

/* glass surfaces */
.btn,.item,.stat,.pbcard,.toast,.panel,.adj,.iconback{border:1px solid var(--border);background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.028));box-shadow:inset 0 1px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.1);-webkit-backdrop-filter:blur(22px) saturate(155%);backdrop-filter:blur(22px) saturate(155%)}
header,.tabbar,.actionbar{background:rgba(13,15,23,.72);-webkit-backdrop-filter:blur(28px) saturate(165%);backdrop-filter:blur(28px) saturate(165%)}
.item::before,.stat::before,.pbcard::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}

/* header */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px rgba(255,255,255,.1)}
.iconback{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;color:#d3d7e1;padding:0}
.iconback:active{background:rgba(255,255,255,.12)}.iconback.off{visibility:hidden}
.hspace{width:44px;flex:0 0 44px}
.htext{flex:1;min-width:0;text-align:center}
.htext small{display:block;color:#ff7d86;font-size:9px;line-height:1.5;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.htext b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.container{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:20px 17px calc(var(--tab) + var(--safe) + 28px)}
body.bl .container{padding-bottom:calc(var(--tab) + var(--safe) + 210px)}
body.bf .container{padding-bottom:calc(var(--tab) + var(--safe) + 130px)}
.view{animation:viewIn .32s cubic-bezier(.2,.7,.2,1) both}
.list{display:flex;flex-direction:column;gap:11px}
.list>*{animation-delay:calc(var(--i,0)*35ms)}
.list.still>*{animation:none}
.list.still>.item.fresh{animation:flashGreen 1.1s ease-out}

/* buttons / rows */
.btn{position:relative;overflow:hidden;width:100%;min-height:58px;padding:14px 17px;border-radius:16px;font-size:16px;font-weight:600;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;animation:cardIn .42s cubic-bezier(.2,.7,.2,1) both;transition:transform .16s ease,border-color .2s ease,background .2s ease}
.btn:hover{border-color:rgba(255,255,255,.23)}.btn:active{transform:scale(.985);background:rgba(255,255,255,.095)}
.btn::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-120%);pointer-events:none}
.btn:active::after{animation:sweep .5s ease-out}
.btn.danger{margin-top:12px;border-color:rgba(255,81,94,.2);background:rgba(255,59,72,.05);color:#ff929a}
.item{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 17px;border-radius:17px;animation:cardIn .35s ease-out both;scroll-margin:90px 0 260px}
.item.fresh{animation:cardIn .35s ease-out both,flashGreen 1.1s ease-out}
.item .big{font-size:18px}
.delete-btn{flex:0 0 auto;min-width:44px;min-height:44px;border:1px solid rgba(255,91,103,.22);border-radius:13px;color:#ff8790;font-size:13px;font-weight:700;background:linear-gradient(145deg,rgba(255,59,72,.16),rgba(255,255,255,.035))}
.pb{color:var(--green);font-weight:700}.slow{color:#ff818b;font-weight:700}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:4px 9px;border-radius:99px;color:var(--green);background:rgba(103,245,167,.12);border:1px solid rgba(103,245,167,.35)}
.badge.sm{padding:2px 7px;font-size:9px}.badge.off{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--border)}
.pbcard{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:16px;border-radius:20px}
.pbcard .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:800;letter-spacing:-.8px;color:var(--green);margin-top:8px}.pbcard .t.dim{color:var(--muted)}
.pbcard.celebrate{animation:pbBurst 1.1s ease-out}
.pbcard.celebrate::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:sweep .9s ease-out}
.empty{text-align:center;color:var(--muted);padding:28px 10px;line-height:1.6}
.empty .btn{margin:14px auto 0;max-width:260px;justify-content:center;color:var(--text)}

/* inputs */
input,select{width:100%;min-height:48px;padding:12px;color:var(--text);font-size:17px;border:1px solid rgba(255,255,255,.15);border-radius:13px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px rgba(255,255,255,.055);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:rgba(255,91,104,.72);box-shadow:0 0 0 3px rgba(255,59,72,.1)}
input.invalid{border-color:var(--red);animation:shakeX .25s ease-out}
input::placeholder{color:rgba(190,197,212,.52)}select option{background:#171923;color:#f6f7fb}
:focus-visible{outline:2px solid rgba(255,105,116,.9);outline-offset:3px}
.lbl{display:block;color:#aaa;font-size:14px;margin:0 0 6px}
.sec{margin:26px 0 14px;font-size:20px;letter-spacing:-.3px}.sec:first-child{margin-top:0}
.field{margin-bottom:16px}
.compute-btn{width:100%;min-height:56px;padding:16px 18px;color:#fff;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:linear-gradient(120deg,#ff4654,#d8192c 72%,#b80d22);box-shadow:inset 0 1px rgba(255,255,255,.28),0 8px 24px rgba(226,25,45,.2);transition:transform .12s,opacity .15s}
.compute-btn:active{opacity:.9;transform:scale(.985)}
.stat{position:relative;overflow:hidden;padding:21px;margin-bottom:15px;border-radius:20px;line-height:1.75;animation:cardIn .35s ease-out both}
.stat hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:10px 0}
.stat .bar{height:7px;margin-top:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.stat .bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--red),#ff4444);box-shadow:0 0 14px rgba(255,59,72,.23);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stat .bar.gain>i{background:linear-gradient(90deg,#00a82a,var(--green));box-shadow:0 0 14px rgba(103,245,167,.2)}
.stat .big{font-size:26px;font-weight:800;letter-spacing:-.8px;display:inline-block}.stat .big.pop{animation:popIn .45s ease-out both}
.saved-type{display:block;font-size:9px;font-weight:800;letter-spacing:1.5px;margin-bottom:4px;text-transform:uppercase}
.saved-main{font-size:16px;font-weight:700;line-height:1.5}.saved-dates{display:block;font-size:13px;color:var(--muted);margin-top:4px}

/* bottom bars */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:80;height:calc(var(--tab) + var(--safe));padding:6px 10px var(--safe);border-top:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px rgba(255,255,255,.1)}
.tabs{display:flex;gap:6px;max-width:660px;margin:0 auto}
.tab{position:relative;overflow:hidden;flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent;border-radius:16px;background:none;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px;transition:color .2s,background .2s}
.tab i{font-style:normal;font-size:19px;line-height:1}
.tab.on{color:#fff;border-color:rgba(255,85,98,.4);background:linear-gradient(120deg,rgba(255,57,72,.2),rgba(255,255,255,.05));box-shadow:inset 0 1px rgba(255,255,255,.16)}
.tab.on i{color:#ff7b85}
.tab::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-120%);pointer-events:none}
.tab:active::after{animation:sweep .5s ease-out}
.actionbar{display:none;position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--safe));z-index:70;padding:10px 14px 8px;border-top:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px rgba(255,255,255,.1)}
body.bl #lapBar,body.bf #finBar{display:block}
.abin{max-width:660px;margin:0 auto}
.adjrow{display:flex;gap:6px;margin-bottom:8px}
.adj{flex:1;min-height:44px;border-radius:13px;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#d3d7e1}.adj:active{background:rgba(255,255,255,.12)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;text-align:center;font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace}
.addbtn{flex:0 0 88px;min-height:48px;color:#fff;font-weight:800;font-size:15px;border:1px solid rgba(255,255,255,.28);border-radius:16px;background:linear-gradient(145deg,rgba(255,86,97,.98),rgba(198,15,33,.92));box-shadow:inset 0 1px rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.28);animation:pulseGlow 3.8s ease-in-out infinite .6s;transition:transform .12s}
.addbtn:active{transform:scale(.94)}
.msg{min-height:18px;padding-top:4px;font-size:12px;color:#ff818b;text-align:center}

/* toast + modal */
#toastWrap{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:200;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:calc(100% - 28px);padding:4px 6px 4px 18px;min-height:48px;border-radius:18px;font-size:14px;font-weight:600;animation:popIn .4s ease-out both}
.toast button{min-width:44px;min-height:44px;padding:0 12px;background:none;border:0;color:#ff929a;font-weight:800;font-size:13px}
.toast.pb{padding-right:18px;color:#eafff3;border-color:rgba(103,245,167,.45);background:linear-gradient(120deg,rgba(103,245,167,.2),rgba(255,255,255,.05));box-shadow:inset 0 1px rgba(255,255,255,.14),0 0 28px rgba(103,245,167,.22)}
.scrim{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(4,5,9,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel{width:min(380px,calc(100% - 40px));padding:24px;border-radius:24px;background:rgba(18,21,30,.82);animation:popIn .35s ease-out both}
.panel h3{margin:0 0 8px;font-size:19px;letter-spacing:-.3px}.panel p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.6}
.mrow{display:flex;gap:10px}
.mbtn{flex:1;min-height:48px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07)}
.mbtn.ok{border-color:rgba(255,255,255,.25);background:linear-gradient(120deg,#ff4654,#d8192c 72%,#b80d22);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.28)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header>
  <button id="backBtn" class="iconback off" aria-label="Back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <div class="htext"><small id="hLabel">LMU Tracker</small><b id="hTitle">Laps</b></div>
  <span class="hspace"></span>
</header>

<div class="container">
  <div id="tracks" class="view hidden"><div id="trackList" class="list"></div></div>

  <div id="records" class="view hidden">
    <div id="pbCard" class="pbcard"></div>
    <div id="recordsList" class="list"></div>
  </div>

  <div id="raceFinish" class="view hidden"><div id="finishList" class="list"></div></div>

  <div id="progress" class="view hidden">
    <h2 class="sec">Track pace</h2>
    <div class="field"><label class="lbl" for="progressTrack">Select track</label><select id="progressTrack"></select></div>
    <div class="field"><label class="lbl" for="trackDays">Time period (days)</label><input type="number" id="trackDays" value="30" inputmode="numeric"></div>
    <button class="compute-btn" onclick="computeTrackProgress()">See track progress</button>
    <div id="trackProgressResult" style="margin-top:20px"></div>
    <h2 class="sec">Overall finishes</h2>
    <div class="field"><label class="lbl" for="globalDays">Time period (days)</label><input type="number" id="globalDays" value="30" inputmode="numeric"></div>
    <button class="compute-btn" onclick="computeGlobalProgress()">See overall progress</button>
    <div id="globalProgressResult" style="margin-top:20px"></div>
  </div>

  <div id="savedProgression" class="view hidden">
    <div id="savedList" class="list"></div>
    <button class="btn" style="margin-top:18px" onclick="clearSaved()">Clear saved history <span aria-hidden="true">↺</span></button>
    <button class="btn danger" onclick="resetAllData()"><span>Reset all data<br><small style="font-weight:400;opacity:.7">Clear saved laps, race history and comparisons</small></span><span aria-hidden="true">↺</span></button>
  </div>
</div>

<div id="lapBar" class="actionbar"><div class="abin">
  <div class="adjrow">
    <button class="adj" onclick="adjust(-100)" aria-label="Minus 0.1 seconds">−0.1</button>
    <button class="adj" onclick="adjust(-10)" aria-label="Minus 0.01 seconds">−0.01</button>
    <button class="adj" onclick="adjust(10)" aria-label="Plus 0.01 seconds">+0.01</button>
    <button class="adj" onclick="adjust(100)" aria-label="Plus 0.1 seconds">+0.1</button>
  </div>
  <div class="inrow"><input id="lapInput" type="text" inputmode="decimal" autocomplete="off" placeholder="1:58.432" aria-label="Lap time" aria-describedby="lapMsg"><button class="addbtn" onclick="addLap()">Add</button></div>
  <div id="lapMsg" class="msg" aria-live="polite"></div>
</div></div>

<div id="finBar" class="actionbar"><div class="abin">
  <div class="inrow"><input id="posInput" type="number" inputmode="numeric" min="1" placeholder="Finish position (P)" aria-label="Finish position" aria-describedby="finMsg"><button class="addbtn" onclick="addFinish()">Add</button></div>
  <div id="finMsg" class="msg" aria-live="polite"></div>
</div></div>

<nav class="tabbar" aria-label="Main"><div class="tabs">
  <button class="tab" data-v="tracks" onclick="setTab('tracks')"><i aria-hidden="true">◷</i>Laps</button>
  <button class="tab" data-v="raceFinish" onclick="setTab('raceFinish')"><i aria-hidden="true">⚑</i>Races</button>
  <button class="tab" data-v="progress" onclick="setTab('progress')"><i aria-hidden="true">↗</i>Progress</button>
  <button class="tab" data-v="savedProgression" onclick="setTab('savedProgression')"><i aria-hidden="true">▤</i>History</button>
</div></nav>

<div id="toastWrap"></div>

<div id="modal" class="scrim hidden"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="mrow"><button id="mCancel" class="mbtn" onclick="closeModal(false)">Cancel</button><button id="mOk" class="mbtn ok" onclick="closeModal(true)">Confirm</button></div>
</div></div>

<script>
const LMU_TRACKS = ["Bahrain","Fuji","Imola","Interlagos","COTA","Le Mans","Monza","Portimão","Qatar","Sebring","Silverstone","Spa-Francorchamps","Barcelona-Catalunya","Paul Ricard","Daytona","Laguna Seca","Road Atlanta","Long Beach"];
const MAX_SAVED = 100, KEY = 'simTrackerLMU';
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// --- STORAGE + MIGRATION (old shape -> same shape plus stable ids, nothing removed) ---
let db; try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
db = db || {}; db.laps = db.laps || {}; db.finishes = db.finishes || []; db.saved = db.saved || [];
Object.values(db.laps).forEach(a => a.forEach(l => { l.id = l.id || uid(); }));
db.finishes.forEach(f => { f.id = f.id || uid(); });
db.saved.forEach(s => { s.id = s.id || uid(); });
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
save();

let currentTrack = null, stack = ['tracks'];

// --- NAVIGATION ---
const HEAD = { tracks:['LMU Tracker','Laps'], raceFinish:['LMU Tracker','Races'], progress:['LMU Tracker','Progress'], savedProgression:['LMU Tracker','History'], records:['Lap records',null] };
function setTab(v) { stack = [v]; renderView(v); }                      // tab = new root, stack reset
function navigateTo(v, track) { if (track) currentTrack = track; stack.push(v); renderView(v); }
function goBack() { if (stack.length > 1) { stack.pop(); renderView(stack[stack.length - 1]); } }  // no-op at root

function renderView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.add('hidden'));
  const el = $(v); el.classList.remove('hidden');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  ({ tracks:renderTrackList, records:renderRecords, raceFinish:renderFinishes, progress:populateTrackSelect, savedProgression:renderSaved })[v]();
  const h = HEAD[v]; $('hLabel').textContent = h[0]; $('hTitle').textContent = h[1] || currentTrack;
  $('backBtn').classList.toggle('off', stack.length < 2);
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.v === stack[0]; t.classList.toggle('on', on); on ? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current'); });
  document.body.classList.toggle('bl', v === 'records');
  document.body.classList.toggle('bf', v === 'raceFinish');
  window.scrollTo(0, 0); animateBars();
}

// swipe right = back (ignores inputs, vertical scrolls, modal)
let g = null;
document.addEventListener('touchstart', e => { const t = e.touches[0]; g = (e.touches.length === 1 && !e.target.closest('input,select,textarea,.scrim')) ? { x:t.clientX, y:t.clientY, dx:0, dy:0 } : null; }, { passive:true });
document.addEventListener('touchmove', e => { if (!g) return; const t = e.touches[0]; g.dx = t.clientX - g.x; g.dy = t.clientY - g.y; if (Math.abs(g.dy) > 30 && Math.abs(g.dy) > Math.abs(g.dx)) g = null; }, { passive:true });
document.addEventListener('touchend', () => { if (g && g.dx > 60 && g.dx > Math.abs(g.dy) * 2) goBack(); g = null; });
document.addEventListener('touchcancel', () => { g = null; });

// --- HELPERS ---
function formatTime(ms) {
  if (!ms) return "--:--.---";
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), mm = ms % 1000;
  return `${m}:${s.toString().padStart(2,'0')}.${mm.toString().padStart(3,'0')}`;
}
function formatDateRange(days) { const end = new Date(), start = new Date(); start.setDate(end.getDate() - days); return `${start.toLocaleDateString()} to ${end.toLocaleDateString()}`; }
function signedDelta(d) { return `${d > 0 ? '+' : '-'}${formatTime(Math.abs(d))}`; }
const secs = d => `${d < 0 ? '−' : '+'}${(Math.abs(d) / 1000).toFixed(3)}s`;
const bestOf = t => { const a = db.laps[t] || []; return a.length ? Math.min(...a.map(l => l.time)) : null; };  // all-time PB

// --- FEEDBACK: toast / undo / modal ---
let tT;
function toast(msg, o = {}) {
  const w = $('toastWrap'); clearTimeout(tT); w.innerHTML = '';
  const t = document.createElement('div'); t.className = 'toast' + (o.pb ? ' pb' : ''); t.setAttribute('role', 'status');
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (o.undo) { const b = document.createElement('button'); b.textContent = 'Undo'; b.onclick = () => { o.undo(); w.innerHTML = ''; clearTimeout(tT); }; t.appendChild(b); }
  w.appendChild(t); tT = setTimeout(() => { w.innerHTML = ''; }, o.pb ? 4500 : 5000);
}
function removeItem(arr, id, redraw) {
  const i = arr.findIndex(x => x.id === id); if (i < 0) return;
  const [it] = arr.splice(i, 1); save(); redraw();
  toast('Deleted', { undo: () => { arr.splice(i, 0, it); save(); redraw(); } });
}
let mResolve, mPrev;
function askConfirm(title, text, ok) {
  return new Promise(res => { mResolve = res; mPrev = document.activeElement; $('mTitle').textContent = title; $('mText').textContent = text; $('mOk').textContent = ok; $('modal').classList.remove('hidden'); $('mCancel').focus(); });
}
function closeModal(v) { $('modal').classList.add('hidden'); if (mPrev && mPrev.focus) mPrev.focus(); const r = mResolve; mResolve = null; if (r) r(v); }
document.addEventListener('keydown', e => {
  if ($('modal').classList.contains('hidden')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(false); }
  if (e.key === 'Tab') { e.preventDefault(); const b = [$('mCancel'), $('mOk')], i = b.indexOf(document.activeElement); b[(i + (e.shiftKey ? -1 : 1) + 2) % 2].focus(); }
});
$('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(false); });
function fieldErr(msgId, inputId, text) {
  $(msgId).textContent = text; const i = $(inputId); i.classList.remove('invalid');
  if (text) { void i.offsetWidth; i.classList.add('invalid'); i.setAttribute('aria-invalid', 'true'); } else i.removeAttribute('aria-invalid');
}

// --- TRACKS ---
function renderTrackList() {
  const l = $('trackList'); l.innerHTML = '';
  LMU_TRACKS.forEach((t, i) => {
    const pb = bestOf(t), b = document.createElement('button');
    b.className = 'btn'; b.style.setProperty('--i', Math.min(i, 10));
    b.innerHTML = `<span>${t}</span><span class="mono ${pb ? 'pb' : 'dim'}">${pb ? formatTime(pb) : '›'}</span>`;
    b.onclick = () => navigateTo('records', t); l.appendChild(b);
  });
}

// --- TIME PARSING ---
function parseTime(raw) {
  const t = raw.trim().replace(',', '.'); let m = 0, s = 0, f = '0', x;
  if (!t) return { err: 'Enter a lap time, e.g. 1:58.432' };
  if ((x = t.match(/^(\d+):(\d{1,2})(?:\.(\d{1,3}))?$/))) { m = +x[1]; s = +x[2]; f = x[3] || '0'; }
  else if ((x = t.match(/^(\d{1,2})(?:\.(\d{1,3}))?$/))) { s = +x[1]; f = x[2] || '0'; }
  else if (/^\d{3,}$/.test(t)) { f = t.slice(-3); s = +t.slice(-5, -3) || 0; m = +t.slice(0, -5) || 0; }
  else return { err: 'Use m:ss.mmm — e.g. 1:58.432, 58.432 or 158432' };
  if (s >= 60) return { err: 'Seconds must be under 60' };
  const ms = m * 60000 + s * 1000 + (+f.padEnd(3, '0'));
  return ms > 0 ? { ms } : { err: 'Lap time must be above zero' };
}
function adjust(d) {
  const inp = $('lapInput'); let r = parseTime(inp.value);
  if (r.err) {
    const last = (db.laps[currentTrack] || []).slice(-1)[0];
    if (!inp.value.trim() && last) r = { ms: last.time }; else return fieldErr('lapMsg', 'lapInput', r.err);
  }
  inp.value = formatTime(Math.max(1, r.ms + d)); fieldErr('lapMsg', 'lapInput', '');
}

// --- LAP RECORDS ---
function renderRecords(still) {
  const laps = db.laps[currentTrack] || [], pb = bestOf(currentTrack);
  $('pbCard').innerHTML = pb
    ? `<div><span class="badge">ALL-TIME PB</span><div class="t">${formatTime(pb)}</div></div><small class="dim">${laps.length} lap${laps.length > 1 ? 's' : ''}</small>`
    : `<div><span class="badge off">NO PB YET</span><div class="t dim">--:--.---</div></div>`;
  const l = $('recordsList'); l.className = 'list' + (still ? ' still' : '');
  if (!laps.length) { l.innerHTML = `<div class="empty">No laps yet — add your first ${currentTrack} lap<br><button class="btn" onclick="$('lapInput').focus()">Enter lap time</button></div>`; return; }
  l.innerHTML = '';
  [...laps].sort((a, b) => a.time - b.time).forEach((x, i) => {
    const d = document.createElement('div'); d.className = 'item'; d.dataset.lapId = x.id; d.style.setProperty('--i', Math.min(i, 10));
    const isPb = x.time === pb;
    d.innerHTML = `<div><span class="mono big ${isPb ? 'pb' : ''}">${formatTime(x.time)}</span>${isPb ? ' <span class="badge sm">PB</span>' : ''}<br><small class="dim">${new Date(x.date).toLocaleDateString()}</small></div><button class="delete-btn" aria-label="Delete lap" onclick="delLap('${x.id}')">✕</button>`;
    l.appendChild(d);
  });
}
function highlight(attr, id) {
  const row = document.querySelector(`[${attr}="${id}"]`); if (!row) return;
  row.classList.add('fresh'); row.scrollIntoView({ block:'nearest', behavior:'smooth' });
  setTimeout(() => row.classList.remove('fresh'), 1200);
}
function addLap() {
  const r = parseTime($('lapInput').value);
  if (r.err) return fieldErr('lapMsg', 'lapInput', r.err);
  fieldErr('lapMsg', 'lapInput', '');
  const prev = bestOf(currentTrack), lap = { id: uid(), time: r.ms, date: Date.now() };
  (db.laps[currentTrack] = db.laps[currentTrack] || []).push(lap); save();
  $('lapInput').value = ''; renderRecords(true); highlight('data-lap-id', lap.id);
  if (prev === null || lap.time < prev) {
    toast(prev === null ? `First ${currentTrack} lap — ${formatTime(lap.time)} is your PB` : `NEW PB — ${secs(lap.time - prev)} vs ${formatTime(prev)}`, { pb:true });
    const c = $('pbCard'); c.classList.remove('celebrate'); void c.offsetWidth; c.classList.add('celebrate'); setTimeout(() => c.classList.remove('celebrate'), 1200);
  }
}
function delLap(id) { removeItem(db.laps[currentTrack], id, () => renderRecords(true)); }

// --- FINISHES ---
function renderFinishes(still) {
  const l = $('finishList'); l.className = 'list' + (still ? ' still' : '');
  if (!db.finishes.length) { l.innerHTML = `<div class="empty">No races yet — log your first finish<br><button class="btn" onclick="$('posInput').focus()">Enter finish position</button></div>`; return; }
  l.innerHTML = '';
  [...db.finishes].sort((a, b) => b.date - a.date).forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'item'; d.dataset.finId = f.id; d.style.setProperty('--i', Math.min(i, 10));
    d.innerHTML = `<div><strong style="font-size:18px">P${f.pos}</strong> <small class="dim" style="margin-left:8px">${new Date(f.date).toLocaleDateString()}</small></div><button class="delete-btn" aria-label="Delete result" onclick="delFinish('${f.id}')">✕</button>`;
    l.appendChild(d);
  });
}
function addFinish() {
  const pos = parseInt($('posInput').value, 10);
  if (!(pos >= 1)) return fieldErr('finMsg', 'posInput', 'Enter a finish position of 1 or higher');
  fieldErr('finMsg', 'posInput', '');
  const f = { id: uid(), pos, date: Date.now() }; db.finishes.push(f); save();
  $('posInput').value = ''; renderFinishes(true); highlight('data-fin-id', f.id);
}
function delFinish(id) { removeItem(db.finishes, id, () => renderFinishes(true)); }
$('lapInput').addEventListener('keydown', e => { if (e.key === 'Enter') addLap(); });
$('posInput').addEventListener('keydown', e => { if (e.key === 'Enter') addFinish(); });
$('lapInput').addEventListener('input', () => fieldErr('lapMsg', 'lapInput', ''));
$('posInput').addEventListener('input', () => fieldErr('finMsg', 'posInput', ''));

// --- PROGRESS ---
function populateTrackSelect() {
  const sel = $('progressTrack'), cur = sel.value;
  sel.innerHTML = LMU_TRACKS.map(t => `<option value="${t}">${t}</option>`).join('');
  if (cur) sel.value = cur; else if (currentTrack) sel.value = currentTrack;
}
function computeTrackProgress() {
  const track = $('progressTrack').value, days = parseInt($('trackDays').value) || 30, now = Date.now();
  const laps = (db.laps[track] || []).filter(l => l.date > now - days * 86400000).sort((a, b) => a.date - b.date);
  const res = $('trackProgressResult');
  if (laps.length < 2) { res.innerHTML = '<div class="stat" style="text-align:center;color:var(--red)">Need at least 2 laps in this period to calculate.</div>'; return; }
  const prev = laps[laps.length - 2], last = laps[laps.length - 1], delta = last.time - prev.time, isGain = delta < 0;
  const pct = ((Math.abs(delta) / prev.time) * 100).toFixed(2), best = Math.min(...laps.map(l => l.time)), dr = formatDateRange(days);
  db.saved.unshift({ id: uid(), type:'track', track, dates:dr, imp:pct, gain:isGain, delta, prevTime:prev.time, lastTime:last.time, timestamp:Date.now() });
  db.saved = db.saved.slice(0, MAX_SAVED); save();
  res.innerHTML = `<div class="stat"><strong style="font-size:18px">${track}</strong><br><span class="dim">${dr}</span><hr>
    Previous lap: <span class="mono">${formatTime(prev.time)}</span><br>Latest lap: <span class="mono">${formatTime(last.time)}</span><hr>
    <span class="${isGain ? 'pb' : 'slow'} big pop">${isGain ? '−' : '+'}${pct}%</span> <span class="dim" style="font-size:14px">(${signedDelta(delta)})</span><br>
    <span class="dim" style="font-size:14px">Session best: ${formatTime(best)}</span>
    <div class="bar ${isGain ? 'gain' : ''}"><i data-w="${Math.min(100, Math.abs(parseFloat(pct)) * 12).toFixed(1)}"></i></div></div>
    <div style="text-align:center;color:var(--green);font-size:12px;margin-top:5px">Saved to Progression History ✓</div>`;
  animateBars();
}
function computeGlobalProgress() {
  const days = parseInt($('globalDays').value) || 30, now = Date.now();
  const fins = db.finishes.filter(f => f.date > now - days * 86400000), res = $('globalProgressResult');
  if (!fins.length) { res.innerHTML = '<div class="stat" style="text-align:center">No races in this period.</div>'; return; }
  const avg = (fins.reduce((a, b) => a + b.pos, 0) / fins.length).toFixed(1), dr = formatDateRange(days);
  db.saved.unshift({ id: uid(), type:'global', dates:dr, avg, timestamp:Date.now() });
  db.saved = db.saved.slice(0, MAX_SAVED); save();
  res.innerHTML = `<div class="stat"><strong style="font-size:18px">Overall Performance</strong><br><span class="dim">${dr}</span><hr>
    Avg Finish: <strong style="font-size:24px">P${avg}</strong><br>Races: ${fins.length}
    <div class="bar gain"><i data-w="${Math.max(4, Math.min(100, (1 - (parseFloat(avg) - 1) / 20) * 100)).toFixed(1)}"></i></div></div>
    <div style="text-align:center;color:var(--green);font-size:12px;margin-top:5px">Saved to Progression History ✓</div>`;
  animateBars();
}

// --- HISTORY ---
function renderSaved(still) {
  const l = $('savedList'); l.className = 'list' + (still ? ' still' : '');
  if (!db.saved.length) { l.innerHTML = `<div class="empty">No comparisons saved yet — run one from Progress<br><button class="btn" onclick="setTab('progress')">Open Progress</button></div>`; return; }
  l.innerHTML = '';
  db.saved.forEach((it, i) => {
    const d = document.createElement('div'); d.className = 'item'; d.style.setProperty('--i', Math.min(i, 10));
    const gain = it.gain !== undefined ? it.gain : true;
    d.innerHTML = (it.type === 'track'
      ? `<div><span class="saved-type" style="color:var(--red)">Track progress</span><span class="saved-main">${it.track}: <span class="${gain ? 'pb' : 'slow'}">${gain ? '−' : '+'}${it.imp}%</span></span><span class="saved-dates">${it.dates}</span></div>`
      : `<div><span class="saved-type" style="color:var(--green)">Overall progress</span><span class="saved-main">Avg Finish: P${it.avg}</span><span class="saved-dates">${it.dates}</span></div>`)
      + `<button class="delete-btn" aria-label="Delete saved entry" onclick="delSaved('${it.id}')">✕</button>`;
    l.appendChild(d);
  });
}
function delSaved(id) { removeItem(db.saved, id, () => renderSaved(true)); }
async function clearSaved() {
  if (await askConfirm('Clear saved history?', 'All saved comparisons will be removed. Laps and race results are not affected.', 'Clear history')) { db.saved = []; save(); renderSaved(); }
}
async function resetAllData() {
  if (await askConfirm('Reset all data?', 'This permanently deletes every lap time, race finish and saved comparison. This can’t be undone.', 'Reset everything')) {
    db = { laps:{}, finishes:[], saved:[] }; save(); renderSaved(); toast('All data has been reset');
  }
}

function animateBars() {
  requestAnimationFrame(() => document.querySelectorAll('.stat .bar > i').forEach(el => { el.style.width = (el.dataset.w || 0) + '%'; }));
}

renderView('tracks');
</script>
</body>
